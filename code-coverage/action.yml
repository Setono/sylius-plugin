name: "Code coverage"
description: "Run PHPUnit with pcov coverage against the test application's database and upload the report to Codecov"

inputs:
    php-version:
        description: "PHP version to install"
        required: false
        default: "8.3"
    dependencies:
        description: "Composer dependency versions: lowest or highest"
        required: false
        default: "highest"
    symfony:
        description: "Symfony version constraint for Flex (e.g. ~7.4.0). Empty string disables the constraint."
        required: false
        default: ""
    extensions:
        description: "PHP extensions to install"
        required: false
        default: "intl, mbstring"
    database-url:
        description: "Symfony DATABASE_URL for the test application"
        required: false
        default: "mysql://root:root@127.0.0.1/sylius?serverVersion=8.0"
    node-version:
        description: "Node.js version to install for building the test application's assets"
        required: false
        default: "20"
    codecov-token:
        description: "Codecov upload token. Pass via secrets."
        required: true
    testsuite:
        description: "PHPUnit testsuite name to run. Empty (default) runs all suites."
        required: false
        default: ""

runs:
    using: "composite"
    steps:
        # Runner images don't reliably ship MySQL (ubuntu-latest is Ubuntu 26.04, which has none), so run it from the
        # official image. Starting it first lets it initialise while PHP, Composer and Node are set up. The root action
        # runs functional-tests and code-coverage in one job, so an already running container is reused
        -   shell: "bash"
            run: |
                if [ -z "$(docker ps --quiet --filter 'name=^setono-sylius-plugin-mysql$')" ]; then
                    docker run --detach --name setono-sylius-plugin-mysql --publish 3306:3306 --env MYSQL_ROOT_PASSWORD=root mysql:8.0
                fi

        -   uses: "actions/checkout@v6"

        -   uses: "shivammathur/setup-php@v2"
            with:
                php-version: "${{ inputs.php-version }}"
                extensions: "${{ inputs.extensions }}"
                coverage: "pcov"
                tools: "flex"

        -   uses: "actions/setup-node@v4"
            with:
                node-version: "${{ inputs.node-version }}"

        -   uses: "ramsey/composer-install@v4"
            env:
                SYMFONY_REQUIRE: "${{ inputs.symfony }}"
            with:
                dependency-versions: "${{ inputs.dependencies }}"

        -   shell: "bash"
            working-directory: "tests/Application"
            run: "yarn install"

        -   shell: "bash"
            working-directory: "tests/Application"
            run: "yarn build"

        # Pinging over TCP skips the temporary server the image runs without networking while it initialises
        -   shell: "bash"
            run: |
                for attempt in $(seq 1 60); do
                    if docker exec setono-sylius-plugin-mysql mysqladmin ping --host=127.0.0.1 --user=root --password=root --silent 2>/dev/null; then
                        exit 0
                    fi
                    sleep 2
                done
                docker logs setono-sylius-plugin-mysql
                exit 1

        -   shell: "bash"
            working-directory: "tests/Application"
            env:
                APP_ENV: "test"
                DATABASE_URL: "${{ inputs.database-url }}"
            run: "bin/console doctrine:database:create"

        -   shell: "bash"
            working-directory: "tests/Application"
            env:
                APP_ENV: "test"
                DATABASE_URL: "${{ inputs.database-url }}"
            run: "bin/console doctrine:schema:create"

        -   shell: "bash"
            working-directory: "tests/Application"
            env:
                APP_ENV: "test"
                DATABASE_URL: "${{ inputs.database-url }}"
            run: "bin/console sylius:fixtures:load -n"

        -   shell: "bash"
            env:
                APP_ENV: "test"
                DATABASE_URL: "${{ inputs.database-url }}"
            run: "vendor/bin/phpunit --coverage-clover=.build/logs/clover.xml ${{ inputs.testsuite && format('--testsuite={0}', inputs.testsuite) || '' }}"

        -   uses: "codecov/codecov-action@v5"
            with:
                token: "${{ inputs.codecov-token }}"
