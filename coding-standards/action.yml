name: "Coding standards"
description: "Composer validation/normalization, code style, Rector dry-run, YAML and Twig linting, Symfony LSP diagnostics"

inputs:
    php-version:
        description: "PHP version (use the lowest supported version since higher versions can hide syntax errors)"
        required: false
        default: "8.2"
    dependencies:
        description: "Composer dependency versions: lowest or highest"
        required: false
        default: "highest"
    extensions:
        description: "PHP extensions to install"
        required: false
        default: "intl, mbstring"

runs:
    using: "composite"
    steps:
        -   uses: "actions/checkout@v6"

        -   uses: "shivammathur/setup-php@v2"
            with:
                php-version: "${{ inputs.php-version }}"
                extensions: "${{ inputs.extensions }}"
                coverage: "none"
                tools: "symfony"

        -   uses: "ramsey/composer-install@v4"
            with:
                dependency-versions: "${{ inputs.dependencies }}"

        -   shell: "bash"
            run: "composer validate --strict"

        -   shell: "bash"
            run: "composer normalize --dry-run"

        -   shell: "bash"
            run: "vendor/bin/ecs check"

        -   shell: "bash"
            run: "vendor/bin/rector process --dry-run"

        -   shell: "bash"
            working-directory: "tests/Application"
            run: "bin/console lint:yaml ../../.github ../../config ../../translations"

        -   shell: "bash"
            working-directory: "tests/Application"
            run: "bin/console lint:twig ../../templates"

        # symfony lsp:check installs the Symfony Language Tools from their GitHub releases. The CLI asks GitHub's API
        # for the latest release at most once a day per installation, and uses the installed copy when that fails
        -   if: "hashFiles('.symfony-lsp.json') != ''"
            id: "symfony-language-tools"
            shell: "bash"
            run: |
                echo "cache-dir=$(symfony lsp:cache-dir)" >> "$GITHUB_OUTPUT"
                echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

        # One cache entry per day, matching the CLI's daily update check: later runs that day restore a copy checked
        # within 24 hours, so they make no API call at all
        -   if: "hashFiles('.symfony-lsp.json') != ''"
            uses: "actions/cache@v6"
            with:
                path: "${{ steps.symfony-language-tools.outputs.cache-dir }}"
                key: "symfony-language-tools-${{ runner.os }}-${{ runner.arch }}-${{ steps.symfony-language-tools.outputs.day }}"
                restore-keys: "symfony-language-tools-${{ runner.os }}-${{ runner.arch }}-"

        # Unauthenticated API calls are limited to 60 an hour per IP address, which runners share, so the lookup fails
        # with HTTP 403 now and then. The CLI authenticates with GITHUB_TOKEN when it is set
        -   if: "hashFiles('.symfony-lsp.json') != ''"
            shell: "bash"
            env:
                GITHUB_TOKEN: "${{ github.token }}"
            run: "symfony lsp:check --format=github"
